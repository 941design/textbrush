name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Lint Python
        run: uv run ruff check textbrush tests scripts/package_release.py

      - name: Format check Python
        run: uv run ruff format --check textbrush tests scripts/package_release.py

  test-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Run fast tests
        run: uv run pytest -m "not slow and not integration" --tb=short

  test-e2e-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Run E2E smoke tests (fast only)
        run: uv run pytest -m "e2e_smoke and not slow" --tb=short

  test-rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src-tauri/ui/package-lock.json

      - name: Install locked frontend tools
        run: make ui-deps

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - name: Build current frontend assets
        run: make build-ui

      - name: Build Rust
        working-directory: src-tauri
        run: cargo build

      - name: Test Rust
        working-directory: src-tauri
        run: cargo test

  build:
    needs: [lint, test-python, test-e2e-smoke, test-rust]
    strategy:
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src-tauri/ui/package-lock.json

      - name: Install locked frontend tools
        run: make ui-deps

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Tauri dependencies (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - name: Install dependencies
        run: uv sync

      - name: Build Tauri app and platform bundles
        run: make package TARGET=${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: textbrush-${{ matrix.target }}
          if-no-files-found: error
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
