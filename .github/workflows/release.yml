name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            asset_name: textbrush-macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset_name: textbrush-macos-x64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset_name: textbrush-linux-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src-tauri/ui/package-lock.json

      - name: Install locked frontend tools
        run: make ui-deps

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Tauri dependencies (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - name: Build native package
        run: make package TARGET=${{ matrix.target }}

      - name: Verify and collect release artifacts
        run: uv run python scripts/package_release.py --target ${{ matrix.target }} --asset-name ${{ matrix.asset_name }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          fail_on_unmatched_files: true
          files: release-assets/*
          body: |
            ## Prerequisites

            The Textbrush backend requires **Python 3.11+** with the `textbrush[model]` package installed:

            ```bash
            pip install "textbrush[model]"
            ```

            `uv` is **not** required on the target system. Install the backend into a Python environment and set `TEXTBRUSH_PYTHON` to its executable, or activate it so `python3` is on `PATH`. Release imports exclude the current directory, PYTHONPATH and user-site packages.

            ## Installation

            ### macOS
            1. Install Python 3.11+ if not already available (e.g. via [python.org](https://python.org) or `brew install python`)
            2. Install the backend: `pip install "textbrush[model]"`
            3. Download `Textbrush_x.y.z_aarch64.dmg` (Apple Silicon) or `Textbrush_x.y.z_x64.dmg` (Intel)
            4. Open the .dmg and drag Textbrush to Applications
            5. Run `xattr -cr /Applications/Textbrush.app` to bypass Gatekeeper
            6. Launch the app or use CLI: `/Applications/Textbrush.app/Contents/MacOS/textbrush --prompt "Your prompt"`

            Alternative: Download the .tar.gz and extract manually.

            ### Linux
            1. Install Python 3.11+ if not already available
            2. Install the backend: `pip install "textbrush[model]"`
            3. Download `textbrush-linux-x64.tar.gz`
            4. Extract: `tar -xzf textbrush-linux-x64.tar.gz`
            5. Run: `./textbrush --prompt "Your prompt"`

            ## Verification
            Verify downloads with the provided .sha256 checksums.
          draft: true
